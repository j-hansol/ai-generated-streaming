# 온라인 강의 솔루션용 MediaMTX 설정 (학습용, 로컬 PC 전용)
# 여기에 적지 않은 항목은 MediaMTX 기본값을 사용한다.
# 전체 옵션: https://github.com/bluenviron/mediamtx/blob/main/mediamtx.yml

logLevel: info

###############################################
# 인증
# 1단계: 이 PC(localhost)에서 오는 요청만 송출/시청을 허용한다.
# 2단계에서 authMethod: http 로 바꾸고 Node 서버가 권한을 판단하게 한다.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

###############################################
# 제어 API: Node 서버가 방송 상태(송출 중 여부, 시청자 수)를 조회할 때 사용
api: true
apiAddress: 127.0.0.1:9997

###############################################
# 사용하지 않는 프로토콜은 끈다
rtsp: false
srt: false
moq: false

# RTMP: OBS로 송출하고 싶을 때 사용 (rtmp://localhost:1935/classroom/<id>)
rtmp: true
rtmpAddress: 127.0.0.1:1935

###############################################
# LL-HLS (Low-Latency HLS): 지연 2~4초, 시청자가 많아도 버티는 방식
hls: true
hlsAddress: 127.0.0.1:8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# 시청자가 없어도 미리 HLS를 만들어 두어 첫 재생을 빠르게 한다
hlsAlwaysRemux: true

###############################################
# WebRTC (WHIP 송출 / WHEP 시청): 지연 1초 미만
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: ["*"]
# 영상이 실제로 오가는 UDP 포트.
# Chrome은 127.0.0.1(루프백)로는 WebRTC 연결을 시도하지 않으므로, 네트워크 카드 주소로 받아야 한다.
# 그래서 모든 주소에서 받고(:8189) 네트워크 카드 주소들을 후보로 알린다.
# 보안: 연결을 맺으려면 127.0.0.1:8889(WHIP/WHEP)에서 받는 인증 정보가 필요하므로
# 외부에서 이 UDP 포트만으로는 접속할 수 없다. Windows 방화벽 경고가 뜨면 "취소"해도
# 같은 PC 안의 연결은 동작한다.
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: true
# 내장 브라우저 등 루프백 연결을 쓰는 클라이언트용
webrtcAdditionalHosts: ["127.0.0.1"]

###############################################
# 경로: 강의실마다 classroom/<강의실 ID> 경로를 쓴다. 그 외 경로는 거부된다.
paths:
  "~^classroom/[a-z0-9]+$":
    # 3단계(녹화/다시보기)에서 true로 바꾼다
    record: false
    recordPath: ../data/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
